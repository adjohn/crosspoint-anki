<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashink Deck Upload</title>
    <style>
        /* E-ink Friendly High Contrast Design */
        :root {
            --bg: #ffffff;
            --fg: #000000;
            --border: 2px solid #000000;
        }

        body { 
            font-family: 'Courier New', Courier, monospace; 
            max-width: 600px; 
            margin: 0 auto; 
            padding: 20px; 
            background: var(--bg);
            color: var(--fg);
        }

        h1 {
            text-transform: uppercase;
            border-bottom: var(--border);
            padding-bottom: 10px;
            letter-spacing: 1px;
        }
        
        .upload-area { 
            border: 2px dashed #000; 
            padding: 40px; 
            text-align: center;
            margin: 30px 0;
            position: relative;
            cursor: pointer;
            transition: background 0.2s;
        }
        
        .upload-area:hover {
            background-color: #f4f4f4;
            border-style: solid;
        }

        .upload-area p {
            font-size: 1.1em;
            margin: 0;
            font-weight: bold;
        }

        /* Overlay file input */
        input[type="file"] {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }

        button { 
            width: 100%;
            padding: 15px; 
            font-size: 16px; 
            font-family: inherit;
            font-weight: 900;
            background: #fff;
            color: #000;
            border: var(--border);
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        button:disabled { 
            opacity: 0.3; 
            border-style: dotted;
            cursor: not-allowed;
        }

        button:not(:disabled):hover {
            background: #000;
            color: #fff;
        }
        
        #progress { 
            display: none; 
            margin-top: 30px;
            border: var(--border);
            padding: 15px;
        }
        
        .progress-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 0.9em;
            font-weight: bold;
        }

        progress {
            width: 100%;
            height: 25px;
            -webkit-appearance: none;
            appearance: none;
            border: 1px solid #000;
        }

        /* Progress styling */
        progress::-webkit-progress-bar { background-color: #fff; }
        progress::-webkit-progress-value { background-color: #000; }
        progress::-moz-progress-bar { background-color: #000; }

        #status { 
            margin-top: 20px; 
            font-weight: bold;
            min-height: 20px;
        }
        
        .success { text-decoration: underline; }
        .error { border-left: 4px solid #000; padding-left: 10px; }
    </style>
</head>
<body>
    <h1>Flashink <h1>Upload Anki Deck</h1>mdash; Upload Deck</h1>
    
    <div class="upload-area">
        <input type="file" id="fileInput" accept=".apkg">
        <p id="fileLabel">SELECT .APKG FILE</p>
    </div>
    
    <button id="uploadBtn" disabled>UPLOAD DECK</button>
    
    <div id="progress">
        <div class="progress-header">
            <span>STATUS: PROCESSING</span>
            <span id="progressText">0%</span>
        </div>
        <progress value="0" max="100"></progress>
    </div>
    
    <div id="status"></div>
    
    <script src="lib/jszip.min.js"></script>
    <script src="lib/sql-wasm.js"></script>
    <script src="js/apkg-parser.js"></script>

    <script>
        const fileInput = document.getElementById('fileInput');
        const uploadBtn = document.getElementById('uploadBtn');
        const progress = document.getElementById('progress');
        const progressText = document.getElementById('progressText');
        const status = document.getElementById('status');
        const fileLabel = document.getElementById('fileLabel');
        const progressBar = document.querySelector('progress');
        
        fileInput.addEventListener('change', () => {
            if (fileInput.files.length) {
                const file = fileInput.files[0];
                
                if (!file.name.toLowerCase().endsWith('.apkg')) {
                    status.innerHTML = '<div class="error">INVALID FILE TYPE. PLEASE USE .APKG</div>';
                    uploadBtn.disabled = true;
                    fileLabel.textContent = "INVALID FILE";
                    return;
                }

                fileLabel.textContent = `FILE: ${file.name}`;
                uploadBtn.disabled = false;
                status.textContent = '';
            } else {
                fileLabel.textContent = "SELECT .APKG FILE";
                uploadBtn.disabled = true;
            }
        });
        
        let parser = null;

        function slugifyDeckId(name) {
            const slug = name
                .toLowerCase()
                .replace(/[^a-z0-9]+/g, '-')
                .replace(/^-+|-+$/g, '')
                .slice(0, 64)
                .replace(/-+$/, '');
            return slug || 'deck';
        }

        function setProgress(pct) {
            progressBar.value = pct;
            progressText.textContent = pct + '%';
        }

        function showStatus(message, cssClass) {
            status.textContent = '';
            const div = document.createElement('div');
            if (cssClass) div.className = cssClass;
            div.textContent = message;
            status.appendChild(div);
        }

        uploadBtn.addEventListener('click', async () => {
            if (!fileInput.files.length) return;
            const file = fileInput.files[0];

            uploadBtn.disabled = true;
            fileInput.disabled = true;
            progress.style.display = 'block';
            setProgress(0);
            showStatus('PARSING DECK...');

            try {
                if (!parser) parser = new ApkgParser();

                // Parsing drives 0-80% of the bar; upload takes the rest.
                const deck = await parser.parseApkg(file, (done, total) => {
                    setProgress(total ? Math.round((done / total) * 80) : 0);
                });

                if (!deck.cards.length) {
                    throw new Error('NO CARDS FOUND IN DECK');
                }

                const jsonl = deck.cards
                    .map(c => JSON.stringify({ id: c.id, front: c.front, back: c.back, tags: c.tags }))
                    .join('\n') + '\n';
                const deckId = slugifyDeckId(deck.name);

                setProgress(85);
                showStatus('UPLOADING TO DEVICE...');

                const formData = new FormData();
                formData.append('deckId', deckId);
                formData.append('name', deck.name);
                formData.append('cardCount', String(deck.cards.length));
                // Browser UTC offset in minutes east of UTC; MUST precede the
                // file part (the firmware parses parts sequentially and never
                // sees text fields after the file)
                formData.append('tzMinutes', String(-new Date().getTimezoneOffset()));
                formData.append('file', new Blob([jsonl], { type: 'application/octet-stream' }),
                                deckId + '.jsonl');

                let response;
                try {
                    response = await fetch('/upload-deck', { method: 'POST', body: formData });
                } catch (netErr) {
                    throw new Error('CONNECTION FAILED. CHECK YOU ARE ON THE DEVICE WIFI AND TRY AGAIN.');
                }

                let result = null;
                try {
                    result = await response.json();
                } catch (jsonErr) {
                    // Non-JSON body; fall through to status-code handling
                }

                if (response.ok && result && result.success) {
                    setProgress(100);
                    const count = (typeof result.cards === 'number') ? result.cards : deck.cards.length;
                    showStatus('SUCCESS: DECK "' + deck.name + '" UPLOADED (' + count + ' CARDS)', 'success');
                } else {
                    const detail = (result && result.error) ? result.error : ('HTTP ' + response.status);
                    throw new Error('UPLOAD FAILED: ' + String(detail).toUpperCase());
                }
            } catch (err) {
                showStatus(err.message || 'UPLOAD FAILED', 'error');
            } finally {
                uploadBtn.disabled = false;
                fileInput.disabled = false;
            }
        });
    </script>
</body>
</html>
